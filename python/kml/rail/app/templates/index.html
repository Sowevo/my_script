<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铁路行程编辑器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    .leaflet-control-fit-all[hidden] { display: none; }
    .leaflet-bar.no-journey .leaflet-control-zoom-out {
      border-bottom: 0;
      border-radius: 0 0 4px 4px;
    }

    .track-locate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #526277;
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
      vertical-align: middle;
      cursor: pointer;
    }
    .track-locate:hover { color: #0d6efd; }
    .track-locate:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }

    body { margin: 0; padding: 0; }
    .main-layout {
      display: flex;
      flex-direction: row;
      height: 100vh;
      min-width: 0;
    }
    .left-panel {
      width: 390px;
      min-width: 320px;
      max-width: 500px;
      background: #f5f7fa;
      border-right: 1px solid #e0e0e0;
      padding: 18px;
      box-sizing: border-box;
      overflow-y: auto;
      font-family: Arial, sans-serif;
    }
    .right-panel {
      flex: 1;
      min-width: 0;
      background: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #map { width: 100%; height: 100%; min-height: 600px; border-radius: 8px; }
    .station-map-status { background:#fffe; border-radius:4px; padding:5px 8px; font-size:12px; }
    .station-map-icon { display:flex; align-items:center; justify-content:center; color:#6d28d9; font-size:17px; background:transparent; border:0; filter:drop-shadow(0 0 1px white) drop-shadow(0 0 2px white); }
    .station-map-icon:hover, .station-map-icon:focus { color:#3b0764; }
    .station-map-detail { font-size:13px; line-height:1.6; white-space:normal; overflow-wrap:anywhere; }
    .leaflet-tooltip.station-map-detail { width:max-content; max-width:min(320px, calc(100vw - 48px)); box-sizing:border-box; }
    .choice-way { border:0; background:transparent; padding:0; font:inherit; text-align:left; cursor:pointer; text-decoration:none; color:#334155; margin-right:8px; }
    #ways-list li { display:flex; align-items:center; }
    #ways-list .choice-way { min-width:0; overflow-wrap:anywhere; }
    #ways-list .choice-actions { display:flex; align-items:center; gap:4px; margin-left:auto; flex-shrink:0; }
    .choice-way:hover, .choice-way:focus-visible { color:#0d6efd; text-decoration:underline; }
    #total-path { background:#fff; border:1px solid #dce2ea; border-radius:8px; padding:14px; }
    #overpass-query { width:100%; font:12px/1.5 monospace; resize:vertical; }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 18px 0 10px 0;
      color: #333;
    }
    #ways-list { margin-bottom: 18px; }
    #way-form { margin-bottom: 18px; }
    .place-search { background:#fff; padding:10px; border-radius:6px; width:320px; max-width:calc(100vw - 80px); box-shadow:0 1px 5px #0004; }
    .place-search-results { max-height:240px; overflow-y:auto; overflow-wrap:anywhere; }
    summary { cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    summary::before { content:"\f285" / ""; font-family:"bootstrap-icons"; display:inline-block; font-size:12px; margin-right:7px; transition:transform .15s; }
    details[open] > summary::before { transform:rotate(90deg); }
    .btn .bi { font-size:1em; }
    .track-locate:disabled { opacity:.35; cursor:default; }
    #ways-list { background:#fff; border:1px solid #dce2ea; border-radius:8px; padding:12px; }
    #ways-list .list-group-item { padding:8px; }
    #export-panel { border-top:1px solid #e2e8f0; padding-top:10px; }
    #export-panel > summary { color:#334155; font-weight:600; }
    #export-panel > .export-content { padding-top:12px; }
    @media (hover:hover) and (pointer:fine) {
      #ways-list .choice-actions { opacity:.4; }
      #ways-list li:hover .choice-actions, #ways-list li:focus-within .choice-actions { opacity:1; }
    }
    #query-results .nearby-selected,
    #query-results .nearby-selected:hover,
    #query-results .nearby-selected:focus {
      background-color: #e7f1ff;
      border-left: 4px solid #0d6efd;
      color: #084298;
    }
    #query-results .nearby-selected > div:first-child { font-weight: 600; }
    .list-group-item.active-choice {
      background: #e3f2fd;
      color: #1976d2;
      font-weight: bold;
      border-color: #90caf9;
    }
    .list-group-item {
      cursor: pointer;
      user-select: none;
      padding-top: 4px;
      padding-bottom: 4px;
      margin-bottom: 0;
      font-size: 15px;
      line-height: 1.5;
    }
    .list-group-item .star {
      color: #ff9800;
      font-weight: bold;
      margin-left: 2px;
    }
    @media (max-width: 900px) {
      .main-layout { flex-direction: column; }
      .left-panel { width: 100%; min-width: 0; max-width: none; flex-shrink: 0; padding: 18px; border-right: none; border-bottom: 1px solid #e0e0e0; }
      .right-panel { min-height: 400px; }
    }
  </style>
</head>
<body>
  <div class="main-layout">
    <div class="left-panel">
      <div class="section-title">轨道操作</div>
      <form id="way-form" class="mb-3">
        <div class="input-group">
          <input type="text" id="way_id" class="form-control" placeholder="输入轨道 way ID" aria-label="轨道 way ID" inputmode="numeric" pattern="[0-9]+" maxlength="100" required>
          <button type="submit" class="btn btn-primary" title="按轨道 ID 开始探索" aria-label="按轨道 ID 开始探索"><i class="bi bi-search" aria-hidden="true"></i></button>
        </div>
        <div class="form-text">右键地图查找附近轨道，或输入 ID；已有行程时追加新段。</div>
      </form>
      <div id="ways-list" hidden><b>可选相连轨道:</b><ul class="list-group mt-2"></ul></div>
      <div id="query-status" class="small mb-2" role="status" aria-live="polite"></div>
      <div id="query-results" class="list-group mb-3" style="max-height:320px;overflow-y:auto;"></div>
      <div id="element-detail" class="mb-3" style="overflow-wrap:anywhere;"></div>
      <div id="total-path" hidden>
        <div id="path-summary" class="fw-bold">尚未选择轨道</div>
        <div id="journey-legs" class="mb-2"></div>
        <button id="undo-way" class="btn btn-outline-secondary btn-sm w-100 mb-2" type="button"><i class="bi bi-chevron-double-left me-1" aria-hidden="true"></i>退回一条轨道</button>
        <button id="clear-journey" class="btn btn-outline-danger btn-sm w-100 mb-2" type="button"><i class="bi bi-trash me-1" aria-hidden="true"></i>清空全部</button>
        <details id="export-panel">
          <summary><i class="bi bi-box-arrow-up-right me-1" aria-hidden="true"></i>导出行程</summary>
          <div class="export-content">
        <label for="export-scope" class="small">导出范围</label>
        <select id="export-scope" class="form-select form-select-sm mb-2" aria-label="导出范围"><option value="all">全部行程</option></select>
        <div class="d-grid gap-2">
          <button id="download-kml" type="button" class="btn btn-primary btn-sm"><i class="bi bi-download me-1" aria-hidden="true"></i>下载 KML</button>
          <button id="copy-query" type="button" class="btn btn-outline-secondary btn-sm" disabled><i class="bi bi-clipboard me-1" aria-hidden="true"></i>复制 Overpass 查询</button>
        </div>
        <div id="export-status" class="small mt-2" role="status" aria-live="polite"></div>
        <div id="partial-export-note" class="small text-muted mt-2" hidden>行程含截断轨道，请直接导出 KML 保留准确终点；Overpass 查询仍返回完整 way。</div>
        <details id="query-preview" class="mt-2">
          <summary class="small">查看查询内容</summary>
          <textarea id="overpass-query" class="form-control mt-2" rows="7" readonly aria-label="Overpass 查询内容"></textarea>
        </details>
          </div>
        </details>
      </div>
    </div>
    <div class="right-panel">
      <div id="map"></div>
    </div>
  </div>
  <dialog id="kml-dialog" class="border rounded p-3" style="width:360px;max-width:90vw;">
    <form id="kml-form">
      <div class="fw-bold mb-2">导出 KML</div>
      <div id="kml-stations"></div>
      <div class="small text-muted mb-2">按本地轨道关联车站命名。可修改站名；换乘站重复时，可删除多余的一项。</div>
      <div id="kml-station-status" class="small mb-2" role="status"></div>
      <div class="d-flex gap-2">
        <button id="kml-swap" type="button" class="btn btn-outline-secondary btn-sm">反转站名顺序</button>
        <button id="kml-cancel" type="button" class="btn btn-outline-secondary btn-sm">取消</button>
        <button type="submit" class="btn btn-primary btn-sm">下载</button>
      </div>
    </form>
  </dialog>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='track_styles.js') }}"></script>
  <script src="{{ url_for('static', filename='journey_export.js') }}"></script>
  <script src="{{ url_for('static', filename='journey_engine.js') }}"></script>
  <script src="{{ url_for('static', filename='journey_api.js') }}"></script>
  <script src="{{ url_for('static', filename='journey_cut.js') }}"></script>
  <script src="{{ url_for('static', filename='preview_arrows.js') }}"></script>
  <script src="{{ url_for('static', filename='journey_start.js') }}"></script>
  <script src="{{ url_for('static', filename='choice_viewport.js') }}"></script>
  <script src="{{ url_for('static', filename='station_map.js') }}"></script>
  <script>
    const initialBounds = {{ map_bounds | tojson }};
    let map = L.map('map');
    map.zoomControl.getContainer().querySelector('.leaflet-control-zoom-in').innerHTML = '<i class="bi bi-plus-lg" aria-hidden="true"></i>';
    map.zoomControl.getContainer().querySelector('.leaflet-control-zoom-out').innerHTML = '<i class="bi bi-dash-lg" aria-hidden="true"></i>';
    for (const [selector, label] of [['.leaflet-control-zoom-in', '放大地图'], ['.leaflet-control-zoom-out', '缩小地图']]) {
      const button = map.zoomControl.getContainer().querySelector(selector);
      button.title = label;
      button.setAttribute('aria-label', label);
    }
    if (initialBounds) {
      map.fitBounds(initialBounds, {padding: [20, 20], maxZoom: 12});
    } else {
      map.setView([0, 0], 2);
    }
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    let blueLayers = [];
    let redLayer = null;
    let undoPreviewLayer = null;
    let lastData = null;
    let cutControl = null;
    let startControl = null;
    let selectedStartWay = null;
    const journeyApi = createJourneyApi({
      getData: () => lastData,
      datasetVersion: {{ dataset_version | tojson }},
      onDatasetChanged: message => {
        const status = document.getElementById('query-status');
        status.classList.add('text-danger');
        status.textContent = message;
      }
    });
    const previewArrows = initPreviewArrows(map, {enabled:true});

    // 在线地名定位独立于本地轨道探索，只有提交表单才发送查询。
    let placeMarker = null;
    const PlaceSearch = L.Control.extend({
      onAdd: function() {
        const box = L.DomUtil.create('div', 'place-search');
        box.innerHTML = '<form id="place-form"><div class="input-group input-group-sm">' +
          '<input id="place-query" class="form-control" aria-label="搜索地点" placeholder="城市、车站、机场或地址" maxlength="200" autocomplete="off" required>' +
          '<button class="btn btn-primary" type="submit" title="搜索地点" aria-label="搜索地点"><i class="bi bi-search" aria-hidden="true"></i></button></div></form>' +
          '<div id="place-history" hidden></div>' +
          '<div id="place-status" class="small mt-1" role="status" aria-live="polite"></div>' +
          '<div id="place-results" class="place-search-results list-group mt-1"></div>';
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        L.DomEvent.on(box, 'keydown', L.DomEvent.stopPropagation);
        const historyKey = 'rail.placeSearchHistory.v1';
        const historyPanel = box.querySelector('#place-history');
        const searchInput = box.querySelector('input');
        let activePlaceItem = null;
        let restoringSearchFocus = false;
        function selectPlaceItem(item) {
          if (activePlaceItem) activePlaceItem.classList.remove('active');
          activePlaceItem = item;
          if (item) {
            item.classList.add('active');
            item.scrollIntoView({block:'nearest'});
          }
        }
        let history = [];
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          if (Array.isArray(saved)) history = [...new Set(saved.filter(value =>
            typeof value === 'string' && value.trim() && value.length <= 200))].slice(0, 10);
        } catch (_) {}
        function persistHistory() {
          try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch (_) {}
        }
        function hideHistory() {
          selectPlaceItem(null);
          historyPanel.hidden = true;
          box.querySelector('#place-results').style.display = '';
        }
        function showHistory() {
          if (searchInput.disabled || restoringSearchFocus) return;
          selectPlaceItem(null);
          const query = searchInput.value.trim().toLocaleLowerCase();
          const matches = history.filter(value => value.toLocaleLowerCase().includes(query));
          historyPanel.replaceChildren();
          if (!matches.length) { hideHistory(); return; }
          const header = document.createElement('div');
          header.className = 'd-flex justify-content-between align-items-center mt-2 mb-1';
          const title = document.createElement('small');
          title.className = 'text-muted';
          title.textContent = '搜索历史';
          const clear = document.createElement('button');
          clear.type = 'button';
          clear.className = 'btn btn-sm btn-link p-0';
          clear.textContent = '清空';
          clear.onclick = () => { history = []; persistHistory(); hideHistory(); };
          header.append(title, clear);
          const list = document.createElement('div');
          list.className = 'place-search-results list-group';
          matches.forEach(value => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'list-group-item list-group-item-action small';
            item.textContent = value;
            item.onclick = () => {
              searchInput.value = value;
              box.querySelector('form').requestSubmit();
            };
            list.appendChild(item);
          });
          historyPanel.append(header, list);
          historyPanel.hidden = false;
          box.querySelector('#place-results').style.display = 'none';
        }
        searchInput.addEventListener('focus', showHistory);
        searchInput.addEventListener('click', showHistory);
        searchInput.addEventListener('input', showHistory);
        box.addEventListener('keydown', event => {
          if (event.isComposing || event.keyCode === 229) return;
          if (event.key === 'Escape') { hideHistory(); return; }
          const panel = historyPanel.hidden ? box.querySelector('#place-results') : historyPanel;
          const items = [...panel.querySelectorAll('.list-group-item')];
          if (!items.length) return;
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            const current = items.indexOf(activePlaceItem);
            const next = current < 0 ? (event.key === 'ArrowDown' ? 0 : items.length - 1)
              : (current + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
            selectPlaceItem(items[next]);
          } else if (event.key === 'Enter' && items.includes(activePlaceItem)) {
            event.preventDefault();
            activePlaceItem.click();
          }
        });
        document.addEventListener('pointerdown', event => { if (!box.contains(event.target)) hideHistory(); });
        box.querySelector('form').onsubmit = async event => {
          event.preventDefault();
          const input = box.querySelector('input');
          const button = box.querySelector('button');
          const status = box.querySelector('#place-status');
          const results = box.querySelector('#place-results');
          const query = input.value.trim();
          if (!query || button.disabled) return;
          hideHistory();
          input.disabled = button.disabled = true;
          results.replaceChildren();
          status.classList.remove('text-danger');
          status.textContent = '正在搜索地点…';
          try {
            const response = await fetch(`/geocode?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '地点搜索失败。');
            if (data.results.length) {
              history = [query, ...history.filter(value => value.toLocaleLowerCase() !== query.toLocaleLowerCase())].slice(0, 10);
              persistHistory();
            }
            status.textContent = data.results.length ? '' : '未找到地点，请补充城市或地区名称。';
            data.results.forEach(place => {
              const item = document.createElement('button');
              item.type = 'button';
              item.className = 'list-group-item list-group-item-action small';
              item.textContent = place.name;
              item.onclick = () => {
                selectPlaceItem(null);
                map.closePopup();
                if (place.bounds) map.fitBounds(place.bounds, {padding:[30,30], maxZoom:17});
                else map.setView([place.lat, place.lon], 16);
                if (placeMarker) map.removeLayer(placeMarker);
                const label = document.createElement('span');
                label.textContent = place.name;
                placeMarker = L.circleMarker([place.lat, place.lon], {
                  radius:7, color:'#1976d2', fillColor:'#fff', fillOpacity:1
                }).bindTooltip(label).addTo(map);
                status.textContent = '';
                results.replaceChildren();
              };
              results.appendChild(item);
            });
          } catch (error) {
            status.classList.add('text-danger');
            status.textContent = error.message || '地点搜索失败，请重试。';
          } finally {
            input.disabled = button.disabled = false;
            restoringSearchFocus = true;
            input.focus({preventScroll:true});
            restoringSearchFocus = false;
          }
        };
        return box;
      }
    });
    new PlaceSearch({position:'topright'}).addTo(map);

    function fitAllTracks() {
      if (!lastData) return;
      let all = [];
      lastData.total_path_coords.forEach(x => {
        if (x.coords) all = all.concat(x.coords);
      });
      if (all.length) map.fitBounds(all);
    }
    // 将全览入口放进原生缩放按钮组，共用边框、分隔线和触屏尺寸。
    const fitAllButton = L.DomUtil.create('a', 'leaflet-control-fit-all', map.zoomControl.getContainer());
    fitAllButton.innerHTML = '<i class="bi bi-fullscreen" aria-hidden="true"></i>';
    fitAllButton.hidden = true;
    map.zoomControl.getContainer().classList.add('no-journey');
    fitAllButton.href = '#';
    fitAllButton.title = '查看全部行程';
    fitAllButton.setAttribute('role', 'button');
    fitAllButton.setAttribute('aria-label', '查看全部行程');
    fitAllButton.style.fontSize = '18px';
    L.DomEvent.on(fitAllButton, 'click', function(event) {
      L.DomEvent.stop(event);
      fitAllTracks();
    });
    L.DomEvent.on(fitAllButton, 'keydown', function(event) {
      if (event.key === ' ') {
        L.DomEvent.stop(event);
        fitAllTracks();
      }
    });

    async function fetchWays(way_id, reset=false, options={}) {
      return journeyApi.advance({way_id:Number(way_id), reset, transfer:Boolean(options.transfer)});
    }

    function highlightChoice(data, id) {
      previewArrows.clear('choice-highlight');
      if (redLayer) { map.removeLayer(redLayer); redLayer = null; }
      const choice = data.choice_coords.find(item => item.id == id);
      if (choice?.coords.length >= 2) {
        redLayer = L.polyline(choice.coords, TRACK_STYLES.highlight).addTo(map);
        previewArrows.showTracks('choice-highlight', [choice], TRACK_STYLES.highlight);
      }
    }

    function updateUndoPreview() {
      previewArrows.clear('undo');
      if (undoPreviewLayer) {
        map.removeLayer(undoPreviewLayer);
        undoPreviewLayer = null;
      }
      const button = document.getElementById('undo-way');
      if (!button.matches(':hover') && !button.matches(':focus-visible')) return;
      const undo = lastData?.undo;
      if (undo?.coords.length) {
        // 红色预览即将移除的末尾轨道；不移动地图。
        undoPreviewLayer = L.polyline(undo.coords,
          {...TRACK_STYLES.highlight, interactive:false}).addTo(map);
        const lastTrack = lastData.total_path_coords.at(-1);
        if (lastTrack) previewArrows.showTracks('undo', [lastTrack], TRACK_STYLES.highlight);
      }
    }

    function fitChoices(data) {
      const current = data.total_path_coords.findLast(item =>
        item.id === data.current_way && item.leg === data.legs.length - 1);
      if (!current?.coords.length) return;
      const bounds = L.latLngBounds(current.coords);
      // 当前轨道完整保留；候选从连接处各延伸500至2000米参与缩放。
      const budget = Math.max(500, Math.min(2000,
        bounds.getSouthWest().distanceTo(bounds.getNorthEast()) / 2));
      const points = choiceViewportPoints(current.coords, data.choice_coords, budget,
        (a, b) => L.latLng(a).distanceTo(L.latLng(b)));
      map.stop();
      map.fitBounds(points, {padding: [40, 40], maxZoom: 18, animate: false});
    }

    function renderMap(data, preserveViewport = false) {
      lastData = data;
      const hasJourney = data.total_path_coords.length > 0;
      const submit = document.querySelector('#way-form button[type="submit"]');
      submit.title = hasJourney ? '按轨道 ID 添加下一段' : '按轨道 ID 开始探索';
      submit.setAttribute('aria-label', submit.title);
      fitAllButton.hidden = !hasJourney;
      map.zoomControl.getContainer().classList.toggle('no-journey', !hasJourney);
      blueLayers.forEach(layer => map.removeLayer(layer));
      blueLayers = [];
      highlightChoice(data, null);
      data.total_path_coords.forEach(item => {
        if (item.coords?.length >= 2) {
          blueLayers.push(L.polyline(item.coords,
            {...TRACK_STYLES.journey, color:journeyColour(data.legs[item.leg], item.leg)}).addTo(map));
        }
      });
      // 候选完整绘制，仅默认缩放范围截取局部。
      data.choice_coords.forEach(item => {
        if (item.coords?.length >= 2) {
          blueLayers.push(L.polyline(item.coords,
            TRACK_STYLES.candidate).addTo(map));
        }
      });
      previewArrows.showTracks('journey', data.total_path_coords.map(item => ({
        ...item, color:journeyColour(data.legs[item.leg], item.leg)
      })));
      previewArrows.showTracks('choices', data.choice_coords, TRACK_STYLES.candidate);
      updateUndoPreview();
      if (!preserveViewport) fitChoices(data);
    }

    function renderWays(data, preserveViewport = false) {
      const list = document.getElementById('ways-list');
      list.hidden = !data.legs.length;
      let html = `<b>第 ${data.legs.length} 段 · 当前way:</b> ${data.current_way}
        <button type="button" class="track-locate" id="fit-choices"
          title="显示当前轨道与相连候选" aria-label="显示当前轨道与相连候选"><i class="bi bi-crosshair" aria-hidden="true"></i></button><br>`;
      if (data.choices.length === 0) {
        html += '<div class="small text-muted mt-1">' +
          (data.stop_reason?.includes('接回') ? '已接回本段走过的轨迹，本段结束。' : '暂无相连轨道') + '</div>';
      } else {
        let sortedChoices = [...data.choice_coords];
        let idx = sortedChoices.findIndex(w => w.recommend);
        if (idx > 0) {
          let [rec] = sortedChoices.splice(idx, 1);
          sortedChoices.unshift(rec);
        }
        html += '<b>可选相连轨道:</b><ul class="list-group mt-2">' + sortedChoices.map(w => {
          let name = w.meta && w.meta.tags && w.meta.tags.name ? `（${w.meta.tags.name}）` : '（未命名）';
          let star = w.recommend ? '<span class="star" title="推荐接续轨道" aria-label="推荐接续轨道">⭐</span>' : '';
          let liClass = w.recommend ? 'list-group-item active-choice' : 'list-group-item';
          return `<li class='${liClass}' style='margin-bottom:2px;list-style-type:disc;'><button type="button" class="choice-way" data-wayid="${w.id}">${w.id}${name}${star}</button>
            <span class="choice-actions">
            <button type="button" class="track-locate advance-choice" data-wayid="${w.id}"
              title="只前进这一条轨道" aria-label="只前进轨道 ${w.id}"><i class="bi bi-chevron-double-right" aria-hidden="true"></i></button>
            <button type="button" class="track-locate locate-choice" data-wayid="${w.id}"
              title="查看这条候选轨道全貌" aria-label="查看候选轨道 ${w.id} 全貌"><i class="bi bi-crosshair" aria-hidden="true"></i></button></span></li>`;
        }).join('') + '</ul>';
      }
      list.innerHTML = html;
      renderExport(data);
      // 悬停高亮
      document.querySelectorAll('.choice-way').forEach(function(el){
        el.onmouseenter = function(){
          highlightChoice(data, el.getAttribute('data-wayid'));
        };
        el.onmouseleave = function(){
          highlightChoice(data, null);
        };
        el.onfocus = el.onmouseenter;
        el.onblur = el.onmouseleave;
        el.onclick = function(){
          runTrackAction(() => selectWay(el.getAttribute('data-wayid')));
        }
      });
      document.getElementById('fit-choices').onclick = () => fitChoices(data);
      document.querySelectorAll('.advance-choice').forEach(button => {
        button.onclick = () => stepJourney('forward', Number(button.dataset.wayid));
      });
      document.querySelectorAll('.locate-choice').forEach(button => {
        button.onclick = () => {
          const choice = data.choice_coords.find(item => item.id == button.dataset.wayid);
          if (!choice?.coords.length) return;
          highlightChoice(data, choice.id);
          map.stop();
          map.fitBounds(choice.coords, {padding: [40, 40], maxZoom: 18, animate: false});
        };
      });
      renderMap(data, preserveViewport);
      updateUndoButton();
    }

    function updateUndoButton() {
      const button = document.getElementById('undo-way');
      button.disabled = trackActionPending || !lastData?.legs?.length;
      button.title = '移除末尾一条轨道（截断后移除保留部分）';
      button.setAttribute('aria-label', '退回一条轨道');
    }

    function journeyDistance(data, legIndex) {
      let metres = 0;
      for (const item of data.total_path_coords) {
        if (legIndex !== undefined && item.leg !== legIndex) continue;
        for (let i = 1; i < item.coords.length; i++) {
          metres += L.latLng(item.coords[i - 1]).distanceTo(L.latLng(item.coords[i]));
        }
      }
      return `${(metres / 1000).toFixed(2)} 公里`;
    }

    function renderExport(data) {
      const list = document.getElementById('journey-legs');
      list.replaceChildren();
      const scope = document.getElementById('export-scope');
      const selected = scope.value;
      scope.replaceChildren(new Option('全部行程', 'all'));
      data.legs.forEach((leg, index) => {
        const row = document.createElement('div');
        row.className = 'border-start border-3 ps-2 mb-2 small';
        row.style.setProperty('border-left-color', journeyColour(leg, index), 'important');
        const title = document.createElement('div');
        title.className = 'fw-bold';
        title.textContent = `第 ${index + 1} 段 · ${leg.name}`;
        const info = document.createElement('div');
        info.className = 'text-muted';
        info.textContent = `轨道长度约 ${journeyDistance(data, index)}`;
        row.append(title, info);
        list.appendChild(row);
        scope.add(new Option(`第 ${index + 1} 段`, String(index)));
      });
      scope.value = [...scope.options].some(option => option.value === selected) ? selected : 'all';
      scope.onchange = () => updateExportQuery(data);
      updateExportQuery(data);
    }

    function updateExportQuery(data) {
      const scope = document.getElementById('export-scope').value;
      const path = scope === 'all' ? data.total_path : data.legs[Number(scope)].path;
      const ids = [...new Set(path.map(item => item.way_id))];
      document.getElementById('total-path').hidden = ids.length === 0;
      document.getElementById('path-summary').textContent = `全部行程 · 约 ${journeyDistance(data)}`;
      const query = ids.length ? `[out:json][timeout:25];\n(\n${ids.map(id => `  way(${id});`).join('\n')}\n);\n(._;>;);\nout body;` : '';
      document.getElementById('overpass-query').value = query;
      document.getElementById('copy-query').disabled = !query;
      document.getElementById('partial-export-note').hidden = !path.some(item => item.span);
      document.getElementById('export-status').textContent = '';
    }

    const kmlDialog = document.getElementById('kml-dialog');
    const kmlStations = document.getElementById('kml-stations');
    let kmlDraft = null;
    let stationRequest = null;
    kmlDialog.onclose = () => { stationRequest?.abort(); kmlDraft = null; };
    document.getElementById('kml-cancel').onclick = () => kmlDialog.close();
    document.getElementById('kml-swap').onclick = () => {
      const rows = [...kmlStations.children].reverse();
      rows.forEach((row, index) => {
        row.querySelector('input').dataset.edited = 'yes';
        row.querySelector('label').textContent = index === 0 ? '起点站' : index === rows.length - 1 ? '终点站' : '换乘站';
        kmlStations.appendChild(row);
      });
    };
    document.getElementById('download-kml').onclick = async () => {
      if (!lastData?.legs?.length) return;
      const scope = document.getElementById('export-scope').value;
      kmlDraft = {data:structuredClone(lastData), scope};
      const endpoints = stationEndpoints(kmlDraft.data, scope);
      kmlStations.replaceChildren();
      const rows = endpoints.map((endpoint, index) => {
        const row = document.createElement('div');
        row.className = 'mb-2';
        const label = document.createElement('label');
        label.className = 'small';
        label.textContent = index === 0 ? '起点站' : index === endpoints.length - 1 ? '终点站'
          : `换乘 ${Math.ceil(index / 2)} · ${index % 2 ? '到达站' : '出发站'}`;
        const input = document.createElement('input');
        input.id = `station-name-${index}`;
        input.dataset.stationGroup = index === 0 ? 'start' : index === endpoints.length - 1 ? 'end' : `transfer-${Math.ceil(index / 2)}`;
        label.htmlFor = input.id;
        input.className = 'form-control';
        input.maxLength = 60;
        input.required = true;
        input.oninput = () => { input.dataset.edited = 'yes'; };
        const list = document.createElement('datalist');
        list.id = `station-options-${index}`;
        input.setAttribute('list', list.id);
        const hint = document.createElement('div');
        hint.className = 'small text-muted';
        row.append(label, input, list, hint);
        if (index > 0 && index < endpoints.length - 1) {
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'btn btn-link btn-sm p-0';
          remove.textContent = '删除此项';
          remove.onclick = () => row.remove();
          row.appendChild(remove);
        }
        kmlStations.appendChild(row);
        return {row, input, list, hint, label};
      });
      const status = document.getElementById('kml-station-status');
      status.textContent = '正在读取本地关联车站…';
      kmlDialog.showModal();
      stationRequest?.abort();
      const controller = new AbortController();
      stationRequest = controller;
      try {
        if (!endpoints.length) throw new Error('没有可查询的轨迹端点。');
        const data = await journeyApi.postData('/stations/nearby', {endpoints}, {signal:controller.signal});
        if (controller.signal.aborted || !kmlDialog.open) return;
        rows.forEach(({input, list, hint}, index) => {
          const candidates = data.stations[index];
          candidates.forEach(station => list.appendChild(new Option(`${station.name} · ${station.source} · ${station.distance} 米`, station.name)));
          if (!input.dataset.edited) {
            input.value = candidates[0]?.name || '';
            hint.textContent = candidates[0] ? `${candidates[0].source} · ${candidates[0].distance} 米` : '未找到站名，请手动填写';
          }
        });
        // 只有同一个 stop_area 的同名站点才合并，不使用换乘站组。
        for (let i = 1; i < rows.length - 1; i += 2) {
          const a = data.stations[i][0], b = data.stations[i + 1][0];
          if (a?.stop_area && a.stop_area === b?.stop_area && a.name === b.name && rows[i].row.isConnected && rows[i + 1].row.isConnected
              && !rows[i].input.dataset.edited && !rows[i + 1].input.dataset.edited) {
            rows[i].input.value = a.name;
            rows[i].label.textContent = `换乘 ${Math.ceil(i / 2)}`;
            rows[i].hint.textContent = '同一车站，已合并';
            rows[i + 1].row.remove();
          }
        }
        status.textContent = '请确认站名和顺序；附近车站仅为关联数据缺失时的建议。';
      } catch (error) {
        if (!controller.signal.aborted && kmlDialog.open) status.textContent = error.message || '查询失败，请手动填写站名。';
      }
    };
    document.getElementById('kml-form').onsubmit = event => {
      event.preventDefault();
      if (!kmlDraft) return;
      const entries = [...kmlStations.querySelectorAll('input')].map(input => ({name:input.value.trim(), group:input.dataset.stationGroup}));
      if (entries.length < 2 || entries.some(entry => !entry.name)) {
        document.getElementById('kml-station-status').textContent = '请填写站名。';
        return;
      }
      const names = groupedStationNames(entries);
      const {data, scope} = kmlDraft;
      const kml = journeyKml(data, scope, data.legs.map(journeyColour), names.join(' → '));
      const url = URL.createObjectURL(new Blob([kml], {type:'application/vnd.google-earth.kml+xml'}));
      const link = document.createElement('a');
      link.href = url;
      link.download = stationFilename(...names);
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      kmlDialog.close();
    };

    document.getElementById('copy-query').onclick = async () => {
      const query = document.getElementById('overpass-query');
      if (!query.value) return;
      const status = document.getElementById('export-status');
      try {
        await navigator.clipboard.writeText(query.value);
        status.textContent = '已复制 Overpass 查询。';
      } catch (_) {
        document.getElementById('query-preview').open = true;
        query.focus();
        query.select();
        status.textContent = '无法自动复制，已选中查询内容，请按 Ctrl+C / ⌘C 复制。';
      }
    };

    async function selectWay(way_id, reset=false, options={}) {
      // 自动推进统一由本地行程引擎处理，页面只提交一次选择动作。
      const data = await fetchWays(way_id, reset, options);
      clearNearbyQuery();
      clearPreview();
      document.getElementById('element-detail').replaceChildren();
      renderWays(data);
      if (data.manual_confirmation_required) document.getElementById('query-status').textContent = data.stop_reason;
      return data;
    }

    let trackActionPending = false;
    async function runTrackAction(action, {keepStart = false} = {}) {
      if (trackActionPending) return;
      cutControl?.cancel();
      if (!keepStart) startControl?.cancel();
      trackActionPending = true;
      const status = document.getElementById('query-status');
      status.classList.remove('text-danger');
      status.textContent = '加载中…';
      document.querySelectorAll('#way-form input, #way-form button, #ways-list button, #query-results button, #element-detail button, #element-detail select, #undo-way, #clear-journey').forEach(el => el.disabled = true);
      try {
        await action();
        if (status.textContent === '加载中…') status.textContent = '';
      } catch (error) {
        status.classList.add('text-danger');
        status.textContent = error.message || '请求失败，请重试。';
      } finally {
        trackActionPending = false;
        document.querySelectorAll('#way-form input, #way-form button, #ways-list button, #query-results button, #element-detail button, #element-detail select, #undo-way, #clear-journey').forEach(el => el.disabled = false);
        updateUndoButton();
      }
    }

    const typeNames = {rail: '铁路', subway: '地铁', light_rail: '轻轨', monorail: '单轨铁路'};
    let queryMarker = null;
    let queryCircle = null;
    let previewLayer = null;

    function clearNearbyQuery() {
      selectedStartWay = null;
      if (queryMarker) map.removeLayer(queryMarker);
      if (queryCircle) map.removeLayer(queryCircle);
      queryMarker = queryCircle = null;
      map.closePopup();
      document.getElementById('query-results').replaceChildren();
    }

    function clearPreview() {
      previewArrows.clear('nearby');
      if (previewLayer) map.removeLayer(previewLayer);
      previewLayer = null;
    }

    function elementTitle(item) {
      return `${item.type === 'relation' ? '关系' : '轨道'}：${item.display_name || item.name}（${item.id}）`;
    }

    function relationDirection(item) {
      if (item.relation_type !== 'route') return '';
      if (item.roundtrip) {
        return item.from && item.from === item.to ? `环线 · 起终点：${item.from}` : '环线';
      }
      return item.from || item.to
        ? `${item.from || '起点未标注'} → ${item.to || '终点未标注'}`
        : '未标注起终点';
    }

    function elementButton(item) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'list-group-item list-group-item-action';
      button.dataset.elementType = item.type;
      button.dataset.elementId = String(item.id);
      button.setAttribute('aria-pressed', 'false');
      const title = document.createElement('div');
      title.textContent = elementTitle(item);
      const detail = document.createElement('small');
      detail.className = 'text-muted';
      const relationTypes = {route:'运行线路', route_master:'线路总关系', network:'交通网络'};
      detail.textContent = [typeNames[item.railway] || item.railway,
        relationTypes[item.relation_type] || item.relation_type, item.route, item.ref].filter(Boolean).join(' · ');
      button.append(title, detail);
      const directionText = relationDirection(item);
      if (directionText) {
        const direction = document.createElement('div');
        direction.className = 'small fw-bold';
        direction.textContent = directionText;
        button.appendChild(direction);
      }
      const roles = (item.roles || []).filter(Boolean);
      if (roles.length) {
        const role = document.createElement('div');
        role.className = 'small text-muted';
        role.textContent = `成员角色：${roles.join(' / ')}`;
        button.appendChild(role);
      }
      button.onclick = () => runTrackAction(() => showElement(item.type, item.id));
      return button;
    }

    async function showElement(kind, id) {
      const data = await journeyApi.read(`/elements/${kind}/${id}`);
      if (kind === 'way') selectedStartWay = Number(id);
      // 两个附近列表各自保留选择；继续查看关系时不丢失刚才选中的轨道。
      document.querySelectorAll('#query-results button[data-element-type]').forEach(button => {
        if (button.dataset.elementType !== kind) return;
        const selected = button.dataset.elementId === String(id);
        button.classList.toggle('nearby-selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      clearPreview();
      previewLayer = L.featureGroup(data.geometry.map(coords =>
        L.polyline(coords, TRACK_STYLES.preview))).addTo(map);
      const previewDirection = kind === 'way' ? railPreviewDirection(data.tags) : null;
      previewArrows.showTracks('nearby', data.geometry.map((coords, index) => ({
        coords, meta:data.geometry_meta[index]
      })));
      if (previewDirection) {
        previewLayer.bindTooltip(`箭头：${previewDirection.label}`);
      }
      const panel = document.getElementById('element-detail');
      panel.replaceChildren();
      const heading = document.createElement('h6');
      heading.className = 'd-flex align-items-center gap-1';
      const headingText = document.createElement('span');
      headingText.style.minWidth = '0';
      headingText.textContent = elementTitle(data);
      heading.appendChild(headingText);
      panel.appendChild(heading);
      const zoom = document.createElement('button');
      zoom.type = 'button';
      zoom.className = 'track-locate flex-shrink-0';
      zoom.innerHTML = '<i class="bi bi-crosshair" aria-hidden="true"></i>';
      zoom.title = '缩放到此要素';
      zoom.setAttribute('aria-label', '缩放到此要素');
      zoom.disabled = !data.geometry.length;
      zoom.onclick = () => { if (previewLayer && previewLayer.getBounds().isValid()) map.fitBounds(previewLayer.getBounds(), {padding:[25,25], maxZoom:18}); };
      heading.appendChild(zoom);
      if (kind === 'way') {
        const beginLeg = async () => {
          const hasJourney = Boolean(lastData?.legs?.length);
          await selectWay(id, !hasJourney, {transfer:hasJourney});
          document.getElementById('way_id').value = id;
        };
        if (!lastData?.legs?.length) {
          const start = document.createElement('button');
          start.dataset.startLeg = '';
          start.className = 'btn btn-sm btn-primary mb-2 me-2';
          start.innerHTML = '<i class="bi bi-play me-1" aria-hidden="true"></i>从此轨道开始探索';
          start.onclick = () => runTrackAction(beginLeg);
          panel.appendChild(start);
        }
        if (lastData?.legs?.length) {
          const next = document.createElement('button');
          next.dataset.nextLeg = '';
          next.className = 'btn btn-sm btn-outline-primary mb-2';
          next.innerHTML = '<i class="bi bi-plus-lg me-1" aria-hidden="true"></i>作为下一段继续';
          next.onclick = () => runTrackAction(beginLeg);
          panel.appendChild(next);
        }
      }
      const directionText = relationDirection(data);
      if (directionText) {
        const direction = document.createElement('p');
        direction.className = 'fw-bold my-2';
        direction.textContent = directionText;
        panel.appendChild(direction);
      }
      const membershipSection = document.createElement('details');
      membershipSection.open = true;
      const membershipTitle = document.createElement('summary');
      membershipTitle.className = 'fw-bold my-2';
      membershipTitle.textContent = '直接所属关系';
      const memberships = document.createElement('div');
      memberships.className = 'list-group mb-2';
      const endpointCount = item => Number(Boolean(item.from?.trim())) + Number(Boolean(item.to?.trim()));
      [...data.memberships].sort((a, b) => endpointCount(b) - endpointCount(a))
        .forEach(item => memberships.appendChild(elementButton(item)));
      if (!data.memberships.length) {
        memberships.textContent = '当前索引中没有直接所属关系。';
        memberships.className = 'small text-muted mb-2';
      }
      membershipSection.append(membershipTitle, memberships);
      panel.appendChild(membershipSection);
      const tags = document.createElement('details');
      const caption = document.createElement('summary');
      caption.textContent = '原始标签';
      const table = document.createElement('table');
      table.className = 'table table-sm small';
      Object.entries(data.tags).forEach(([key, value]) => {
        const row = table.insertRow();
        row.insertCell().textContent = key;
        row.insertCell().textContent = value;
      });
      tags.append(caption, table);
      panel.appendChild(tags);
      if (kind === 'relation') {
        const note = document.createElement('p');
        note.className = 'small text-muted';
        note.textContent = `共 ${data.members.length} 个直接成员，按 OSM 原始顺序列出；高亮本地收录的 ${data.ways.length} 段轨道（含子关系）。车站、站台等未收录成员只展示信息。`;
        const members = document.createElement('div');
        members.className = 'list-group';
        members.style.maxHeight = '260px';
        members.style.overflowY = 'auto';
        data.members.forEach((member, index) => {
          const item = document.createElement(member.available ? 'button' : 'div');
          item.className = 'list-group-item small';
          const memberType = {w:'轨道', r:'关系', n:'节点'}[member.type] || member.type;
          item.textContent = `${index + 1}. ${memberType} ${member.ref} · ${member.role || '无角色'}${member.available ? '' : '（未收录）'}`;
          if (member.available) item.onclick = () => runTrackAction(() => showElement(member.type === 'w' ? 'way' : 'relation', member.ref));
          members.appendChild(item);
        });
        panel.append(note, members);
      }
      document.getElementById('query-status').textContent = `已高亮${elementTitle(data)}。`;
    }

    async function queryNearby(latlng, radius) {
      selectedStartWay = null;
      clearPreview();
      document.getElementById('element-detail').replaceChildren();
      const container = document.getElementById('query-results');
      container.replaceChildren();
      if (queryMarker) map.removeLayer(queryMarker);
      if (queryCircle) map.removeLayer(queryCircle);
      queryMarker = L.circleMarker(latlng, {radius:5, color:'#333', fillOpacity:1}).addTo(map);
      queryCircle = L.circle(latlng, {radius, color:'#666', weight:1, fillOpacity:0.06}).addTo(map);
      const data = await journeyApi.read(`/nearby?lat=${latlng.lat}&lon=${latlng.lng}&radius=${radius}`);
      document.getElementById('query-status').textContent =
        `附近 ${radius} 米：${data.total} 段轨道、${data.relations.length} 个所属关系。` +
        (data.total > data.ways.length ? `仅显示最近 ${data.ways.length} 段，请减小查询半径或调整查询位置。` : '') +
        (!data.total ? '此处未找到已收录轨道，请靠近轨道右键查询。' : '') +
        (!data.relations_available ? '当前为旧索引，重新生成索引后可查看关系。' : '');
      [['附近轨道（按距离）', data.ways], ['所属关系', data.relations]].forEach(([title, items]) => {
        if (!items.length) return;
        const group = document.createElement('details');
        group.open = title === '附近轨道（按距离）';
        const heading = document.createElement('summary');
        heading.className = 'list-group-item bg-light fw-bold';
        heading.textContent = title;
        group.appendChild(heading);
        items.forEach(item => group.appendChild(elementButton(item)));
        container.appendChild(group);
      });
    }

    function disabledMenuItem(button, reason, menu) {
      const container = document.createElement('div');
      container.tabIndex = 0;
      let disabledReason = reason;
      const reasonTip = document.createElement('div');
      reasonTip.id = button.id + '-disabled-reason';
      reasonTip.setAttribute('role', 'tooltip');
      Object.assign(reasonTip.style, {position:'fixed', zIndex:'10000', maxWidth:'240px',
        padding:'6px 9px', borderRadius:'5px', background:'#334155', color:'#fff',
        fontSize:'12px', lineHeight:'1.5', pointerEvents:'none'});
      reasonTip.hidden = true;
      document.body.appendChild(reasonTip);
      container.setAttribute('aria-describedby', reasonTip.id);
      let hovering = false;
      const showReason = () => {
        if (!button.disabled || !disabledReason) { reasonTip.hidden = true; return; }
        reasonTip.textContent = disabledReason;
        reasonTip.hidden = false;
        const rect = container.getBoundingClientRect();
        const width = reasonTip.offsetWidth, height = reasonTip.offsetHeight;
        const left = rect.right + width + 16 < window.innerWidth ? rect.right + 8 : rect.left - width - 8;
        reasonTip.style.left = `${Math.max(8, Math.min(left, window.innerWidth - width - 8))}px`;
        reasonTip.style.top = `${Math.max(8, Math.min(rect.top, window.innerHeight - height - 8))}px`;
      };
      container.onmouseenter = () => { hovering = true; showReason(); };
      container.onmouseleave = () => { hovering = false; reasonTip.hidden = true; };
      container.onfocus = () => { if (button.disabled) showReason(); else button.focus(); };
      container.onblur = () => { reasonTip.hidden = true; };
      const removeReason = event => {
        if (event.popup.getContent() !== menu) return;
        reasonTip.remove();
        map.off('popupclose', removeReason);
      };
      map.on('popupclose', removeReason);
      container.appendChild(button);
      return {container, update(reason, allowed) {
        button.disabled = !allowed;
        button.setAttribute('aria-disabled', String(!allowed));
        disabledReason = reason;
        container.tabIndex = allowed ? -1 : 0;
        if (hovering || document.activeElement === container) showReason();
      }};
    }

    map.on('contextmenu', event => {
      L.DomEvent.preventDefault(event.originalEvent);
      if (trackActionPending) return;
      cutControl?.cancel();
      const point = event.latlng.wrap();
      const menu = document.createElement('div');
      menu.setAttribute('role', 'menu');
      menu.setAttribute('aria-label', '查找附近');
      menu.tabIndex = -1;
      const title = document.createElement('div');
      title.className = 'small text-muted mb-2';
      title.textContent = '查找附近';
      menu.appendChild(title);
      const buttons = [100, 250, 500].map(radius => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('role', 'menuitem');
        button.className = 'btn btn-sm btn-light d-block w-100 text-start mb-1';
        button.textContent = `${radius}米`;
        button.onclick = () => {
          map.closePopup();
          runTrackAction(() => queryNearby(point, radius));
        };
        menu.appendChild(button);
        return button;
      });
      if (lastData?.legs?.length) {
        menu.appendChild(document.createElement('hr'));
        const cut = document.createElement('button');
        cut.type = 'button';
        cut.className = 'btn btn-sm btn-light d-block w-100 text-start';
        cut.setAttribute('role', 'menuitem');
        cut.innerHTML = '<i class="bi bi-stop-circle me-1" aria-hidden="true"></i>在此结束本段';
        cut.disabled = true;
        cut.setAttribute('aria-disabled', 'true');
        cut.id = 'end-here';
        const cutHint = disabledMenuItem(cut, '正在检查当前位置…', menu);
        const cutContainer = cutHint.container;
        cut.onclick = () => { map.closePopup(); cutControl.open(point); };
        menu.appendChild(cutContainer);
        buttons.push(cutContainer);
        cutControl.check(point).then(({allowed, reason}) => {
          if (!menu.isConnected) return;
          cutHint.update(reason, allowed);
        });
      }
      if (startControl?.active || selectedStartWay !== null || lastData?.current_way) {
        const start = document.createElement('button');
        start.type = 'button';
        start.className = 'btn btn-sm btn-light d-block w-100 text-start';
        start.innerHTML = '<i class="bi bi-play-circle me-1" aria-hidden="true"></i>从此开始本段';
        start.setAttribute('role', 'menuitem');
        start.onclick = () => {
          map.closePopup();
          if (startControl.active) startControl.choosePoint(point);
          else {
            const wid = selectedStartWay ?? lastData.current_way;
            const replaceCurrent = selectedStartWay === null;
            runTrackAction(() => startControl.select(wid, point, {replaceCurrent}));
          }
        };
        start.id = 'start-here';
        const reason = startControl.active ? '' : startRestriction(lastData, selectedStartWay);
        const startHint = disabledMenuItem(start, reason, menu);
        startHint.update(reason, !reason);
        menu.appendChild(startHint.container);
        buttons.push(startHint.container);
      }
      // 支持键盘选择；点击地图其他位置或按 Escape 关闭菜单。
      menu.onkeydown = e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const enabledButtons = buttons.filter(button => !button.disabled);
          if (!enabledButtons.length) return;
          const index = enabledButtons.findIndex(button => button === document.activeElement || button.contains(document.activeElement));
          const direction = e.key === 'ArrowDown' ? 1 : -1;
          const next = index < 0 ? (direction === 1 ? 0 : enabledButtons.length - 1)
            : (index + direction + enabledButtons.length) % enabledButtons.length;
          enabledButtons[next].focus();
        }
      };
      L.DomEvent.disableClickPropagation(menu);
      L.popup({className:'nearby-menu', minWidth:90, maxWidth:140, closeButton:false, autoPan:false})
        .setLatLng(event.latlng).setContent(menu).openOn(map);
      menu.focus({preventScroll:true});
    });

    cutControl = initJourneyCut(map, {
      getData: () => lastData,
      api: journeyApi,
      runAction: runTrackAction,
      status: text => { document.getElementById('query-status').textContent = text; },
      onChanged: data => {
        clearNearbyQuery();
        clearPreview();
        document.getElementById('element-detail').replaceChildren();
        document.getElementById('way_id').value = data.current_way || '';
        renderWays(data, true);
      }
    });

    startControl = initJourneyStart(map, {
      api: journeyApi,
      previewArrows,
      list: document.getElementById('ways-list'),
      restoreList: () => {
        if (lastData) renderWays(lastData, true);
        else document.getElementById('ways-list').hidden = true;
      },
      busy: () => trackActionPending,
      hasJourney: () => Boolean(lastData?.legs?.length),
      runAction: action => runTrackAction(action, {keepStart:true}),
      clearReference: () => {
        clearPreview();
        clearNearbyQuery();
        document.getElementById('element-detail').replaceChildren();
      },
      onChanged: data => {
        document.getElementById('way_id').value = data.current_way || '';
        renderWays(data, true);
        document.getElementById('query-status').textContent = `已按所选方向开始第 ${data.legs.length} 段。`;
      }
    });

    document.getElementById('clear-journey').onclick = () => runTrackAction(async () => {
      const data = await journeyApi.clear();
      stationMap.refresh();
      clearPreview();
      clearNearbyQuery();
      document.getElementById('element-detail').replaceChildren();
      document.getElementById('way_id').value = '';
      renderWays(data, true);
    });

    const stepJourney = (action, wayId) => runTrackAction(async () => {
      const data = await journeyApi[action](wayId === undefined ? {} : {way_id:Number(wayId)});
      clearNearbyQuery();
      document.getElementById('element-detail').replaceChildren();
      clearPreview();
      document.getElementById('way_id').value = data.current_way || '';
      // 单步进退只更新轨迹，保留用户正在查看的地图范围。
      renderWays(data, true);
    });
    const undoButton = document.getElementById('undo-way');
    undoButton.onclick = () => stepJourney('undo');
    ['mouseenter', 'mouseleave', 'focus', 'blur'].forEach(event =>
      undoButton.addEventListener(event, updateUndoPreview));

    document.getElementById('way-form').onsubmit = async function(e) {
      e.preventDefault();
      const id = document.getElementById('way_id').value.trim();
      await runTrackAction(async () => {
        if (!/^\d+$/.test(id)) throw new Error('请输入数字轨道 ID，或在地图上右键查询。');
        const hasJourney = Boolean(lastData?.legs?.length);
        await selectWay(id, !hasJourney, {transfer:hasJourney});
      });
    };


    const stationMap = initStationMap(map, {read: journeyApi.read});
  </script>

</body>
</html>
