<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>铁路way递归提取与地图展示</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    .leaflet-control-fit-all[hidden] { display: none; }
    .leaflet-bar.no-journey .leaflet-control-zoom-out {
      border-bottom: 0;
      border-radius: 0 0 4px 4px;
    }

    .track-locate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #526277;
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
      vertical-align: middle;
      cursor: pointer;
    }
    .track-locate:hover { color: #0d6efd; }
    .track-locate:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }

    body { margin: 0; padding: 0; }
    .main-layout {
      display: flex;
      flex-direction: row;
      height: 100vh;
      min-width: 0;
    }
    .left-panel {
      width: 390px;
      min-width: 320px;
      max-width: 500px;
      background: #f5f7fa;
      border-right: 1px solid #e0e0e0;
      padding: 32px 18px 18px 18px;
      box-sizing: border-box;
      overflow-y: auto;
      font-family: Arial, sans-serif;
    }
    .right-panel {
      flex: 1;
      min-width: 0;
      background: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #map { width: 100%; height: 100%; min-height: 600px; border-radius: 8px; }
    .choice-way { border:0; background:transparent; padding:0; font:inherit; text-align:left; cursor:pointer; text-decoration:underline; color:#d9534f; margin-right:8px; }
    #ways-list li { display:flex; align-items:center; }
    #ways-list .choice-way { min-width:0; overflow-wrap:anywhere; }
    #ways-list .locate-choice { flex-shrink:0; }
    .choice-way:hover { color:#b52b27; }
    #total-path { background:#fff; border:1px solid #dce2ea; border-radius:8px; padding:14px; }
    #overpass-query { width:100%; font:12px/1.5 monospace; resize:vertical; }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 18px 0 10px 0;
      color: #333;
    }
    #ways-list { margin-bottom: 18px; }
    #way-form { margin-bottom: 18px; }
    .place-search { background:#fff; padding:10px; border-radius:6px; width:320px; max-width:calc(100vw - 80px); box-shadow:0 1px 5px #0004; }
    .place-search-results { max-height:240px; overflow-y:auto; overflow-wrap:anywhere; }
    #query-results summary { display:list-item; list-style-position:inside; cursor:pointer; }
    .list-group-item.active-choice {
      background: #e3f2fd;
      color: #1976d2;
      font-weight: bold;
      border-color: #90caf9;
    }
    .list-group-item {
      cursor: pointer;
      user-select: none;
      padding-top: 4px;
      padding-bottom: 4px;
      margin-bottom: 0;
      font-size: 15px;
      line-height: 1.5;
    }
    .list-group-item .star {
      color: #ff9800;
      font-weight: bold;
      margin-left: 2px;
    }
    @media (max-width: 900px) {
      .main-layout { flex-direction: column; }
      .left-panel { width: 100%; min-width: 0; max-width: none; flex-shrink: 0; padding: 18px; border-right: none; border-bottom: 1px solid #e0e0e0; }
      .right-panel { min-height: 400px; }
    }
  </style>
</head>
<body>
  <div class="main-layout">
    <div class="left-panel">
      <div class="section-title">轨道操作</div>
      <form id="way-form" class="mb-3">
        <div class="input-group">
          <input type="text" id="way_id" class="form-control" placeholder="输入轨道 way ID" aria-label="轨道 way ID" inputmode="numeric" pattern="[0-9]+" maxlength="100" required>
          <button type="submit" class="btn btn-primary" title="按轨道 ID 开始探索" aria-label="按轨道 ID 开始探索"><i class="bi bi-search" aria-hidden="true"></i></button>
        </div>
        <div class="form-text">在地图上右键，选择查询半径，查看附近轨道及所属关系；也可输入轨道 ID 开始探索。</div>
      </form>
      <div id="query-status" class="small mb-2" role="status" aria-live="polite"></div>
      <div id="query-results" class="list-group mb-3" style="max-height:320px;overflow-y:auto;"></div>
      <div id="element-detail" class="mb-3" style="overflow-wrap:anywhere;"></div>
      <div id="ways-list" hidden><b>可选相连轨道:</b><ul class="list-group mt-2"></ul></div>
      <div id="total-path" hidden>
        <div id="path-summary" class="fw-bold">尚未选择轨道</div>
        <div id="path-counts" class="small text-muted mb-2"></div>
        <div id="journey-legs" class="mb-2"></div>
        <button id="undo-way" class="btn btn-outline-secondary btn-sm w-100 mb-2" type="button">退回一条轨道</button>
        <label for="export-scope" class="small">导出范围</label>
        <select id="export-scope" class="form-select form-select-sm mb-2" aria-label="导出范围"><option value="all">全部行程</option></select>
        <div class="d-grid gap-2">
          <button id="download-kml" type="button" class="btn btn-primary btn-sm">下载 KML</button>
          <button id="copy-query" type="button" class="btn btn-primary btn-sm" disabled>复制 Overpass 查询</button>
        </div>
        <div id="export-status" class="small mt-2" role="status" aria-live="polite"></div>
        <details id="query-preview" class="mt-2">
          <summary class="small">查看查询内容</summary>
          <textarea id="overpass-query" class="form-control mt-2" rows="7" readonly aria-label="Overpass 查询内容"></textarea>
        </details>
      </div>
    </div>
    <div class="right-panel">
      <div id="map"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='journey_export.js') }}"></script>
  <script src="{{ url_for('static', filename='choice_viewport.js') }}"></script>
  <script>
    const initialBounds = {{ map_bounds | tojson }};
    let map = L.map('map');
    if (initialBounds) {
      map.fitBounds(initialBounds, {padding: [20, 20], maxZoom: 12});
    } else {
      map.setView([0, 0], 2);
    }
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    let blueLayers = [];
    let redLayer = null;
    let lastData = null;

    // 在线地名定位独立于本地轨道探索，只有提交表单才发送查询。
    let placeMarker = null;
    const PlaceSearch = L.Control.extend({
      onAdd: function() {
        const box = L.DomUtil.create('div', 'place-search');
        box.innerHTML = '<form id="place-form"><div class="input-group input-group-sm">' +
          '<input id="place-query" class="form-control" aria-label="搜索地点" placeholder="城市、车站、机场或地址" maxlength="200" autocomplete="off" required>' +
          '<button class="btn btn-primary" type="submit" title="搜索地点" aria-label="搜索地点"><i class="bi bi-search" aria-hidden="true"></i></button></div></form>' +
          '<div id="place-history" hidden></div>' +
          '<div id="place-status" class="small mt-1" role="status" aria-live="polite"></div>' +
          '<div id="place-results" class="place-search-results list-group mt-1"></div>';
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        L.DomEvent.on(box, 'keydown', L.DomEvent.stopPropagation);
        const historyKey = 'rail.placeSearchHistory.v1';
        const historyPanel = box.querySelector('#place-history');
        const searchInput = box.querySelector('input');
        let history = [];
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          if (Array.isArray(saved)) history = [...new Set(saved.filter(value =>
            typeof value === 'string' && value.trim() && value.length <= 200))].slice(0, 10);
        } catch (_) {}
        function persistHistory() {
          try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch (_) {}
        }
        function hideHistory() {
          historyPanel.hidden = true;
          box.querySelector('#place-results').style.display = '';
        }
        function showHistory() {
          if (searchInput.disabled) return;
          const query = searchInput.value.trim().toLocaleLowerCase();
          const matches = history.filter(value => value.toLocaleLowerCase().includes(query));
          historyPanel.replaceChildren();
          if (!matches.length) { hideHistory(); return; }
          const header = document.createElement('div');
          header.className = 'd-flex justify-content-between align-items-center mt-2 mb-1';
          const title = document.createElement('small');
          title.className = 'text-muted';
          title.textContent = '搜索历史';
          const clear = document.createElement('button');
          clear.type = 'button';
          clear.className = 'btn btn-sm btn-link p-0';
          clear.textContent = '清空';
          clear.onclick = () => { history = []; persistHistory(); hideHistory(); };
          header.append(title, clear);
          const list = document.createElement('div');
          list.className = 'place-search-results list-group';
          matches.forEach(value => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'list-group-item list-group-item-action small';
            item.textContent = value;
            item.onclick = () => {
              searchInput.value = value;
              box.querySelector('form').requestSubmit();
            };
            list.appendChild(item);
          });
          historyPanel.append(header, list);
          historyPanel.hidden = false;
          box.querySelector('#place-results').style.display = 'none';
        }
        searchInput.addEventListener('focus', showHistory);
        searchInput.addEventListener('click', showHistory);
        searchInput.addEventListener('input', showHistory);
        box.addEventListener('keydown', event => { if (event.key === 'Escape') hideHistory(); });
        document.addEventListener('pointerdown', event => { if (!box.contains(event.target)) hideHistory(); });
        box.querySelector('form').onsubmit = async event => {
          event.preventDefault();
          const input = box.querySelector('input');
          const button = box.querySelector('button');
          const status = box.querySelector('#place-status');
          const results = box.querySelector('#place-results');
          const query = input.value.trim();
          if (!query || button.disabled) return;
          hideHistory();
          input.disabled = button.disabled = true;
          results.replaceChildren();
          status.classList.remove('text-danger');
          status.textContent = '正在搜索地点…';
          try {
            const response = await fetch(`/geocode?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '地点搜索失败。');
            if (data.results.length) {
              history = [query, ...history.filter(value => value.toLocaleLowerCase() !== query.toLocaleLowerCase())].slice(0, 10);
              persistHistory();
            }
            status.textContent = data.results.length ? '' : '未找到地点，请补充城市或地区名称。';
            data.results.forEach(place => {
              const item = document.createElement('button');
              item.type = 'button';
              item.className = 'list-group-item list-group-item-action small';
              item.textContent = place.name;
              item.onclick = () => {
                map.closePopup();
                if (place.bounds) map.fitBounds(place.bounds, {padding:[30,30], maxZoom:17});
                else map.setView([place.lat, place.lon], 16);
                if (placeMarker) map.removeLayer(placeMarker);
                const label = document.createElement('span');
                label.textContent = place.name;
                placeMarker = L.circleMarker([place.lat, place.lon], {
                  radius:7, color:'#1976d2', fillColor:'#fff', fillOpacity:1
                }).bindTooltip(label).addTo(map);
                status.textContent = '';
                results.replaceChildren();
              };
              results.appendChild(item);
            });
          } catch (error) {
            status.classList.add('text-danger');
            status.textContent = error.message || '地点搜索失败，请重试。';
          } finally {
            input.disabled = button.disabled = false;
          }
        };
        return box;
      }
    });
    new PlaceSearch({position:'topright'}).addTo(map);

    function fitAllTracks() {
      if (!lastData) return;
      let all = [];
      lastData.total_path_coords.forEach(x => {
        if (x.coords) all = all.concat(x.coords);
      });
      if (all.length) map.fitBounds(all);
    }
    // 将全览入口放进原生缩放按钮组，共用边框、分隔线和触屏尺寸。
    const fitAllButton = L.DomUtil.create('a', 'leaflet-control-fit-all', map.zoomControl.getContainer());
    fitAllButton.innerHTML = '<i class="bi bi-fullscreen" aria-hidden="true"></i>';
    fitAllButton.hidden = true;
    map.zoomControl.getContainer().classList.add('no-journey');
    fitAllButton.href = '#';
    fitAllButton.title = '查看全部行程';
    fitAllButton.setAttribute('role', 'button');
    fitAllButton.setAttribute('aria-label', '查看全部行程');
    fitAllButton.style.fontSize = '18px';
    L.DomEvent.on(fitAllButton, 'click', function(event) {
      L.DomEvent.stop(event);
      fitAllTracks();
    });
    L.DomEvent.on(fitAllButton, 'keydown', function(event) {
      if (event.key === ' ') {
        L.DomEvent.stop(event);
        fitAllTracks();
      }
    });

    async function fetchWays(way_id, reset=false, options={}) {
      const params = new URLSearchParams();
      if (reset) params.set('reset', '1');
      if (options.transfer) params.set('transfer', '1');
      const res = await fetch(`/ways/${way_id}?${params}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '轨道加载失败，请重试。');
      return data;
    }

    function highlightChoice(data, id) {
      if (redLayer) { map.removeLayer(redLayer); redLayer = null; }
      const choice = data.choice_coords.find(item => item.id == id);
      if (choice?.coords.length >= 2) {
        redLayer = L.polyline(choice.coords, {color: 'red', weight: 5}).addTo(map);
      }
    }

    function fitChoices(data) {
      const current = data.total_path_coords.find(item =>
        item.id === data.current_way && item.leg === data.legs.length - 1);
      if (!current?.coords.length) return;
      const bounds = L.latLngBounds(current.coords);
      // 当前轨道完整保留；候选从连接处各延伸500至2000米参与缩放。
      const budget = Math.max(500, Math.min(2000,
        bounds.getSouthWest().distanceTo(bounds.getNorthEast()) / 2));
      const points = choiceViewportPoints(current.coords, data.choice_coords, budget,
        (a, b) => L.latLng(a).distanceTo(L.latLng(b)));
      map.stop();
      map.fitBounds(points, {padding: [40, 40], maxZoom: 18, animate: false});
    }

    function renderMap(data) {
      lastData = data;
      const hasJourney = data.total_path_coords.length > 0;
      const submit = document.querySelector('#way-form button[type="submit"]');
      submit.title = hasJourney ? '按轨道 ID 添加下一段' : '按轨道 ID 开始探索';
      submit.setAttribute('aria-label', submit.title);
      fitAllButton.hidden = !hasJourney;
      map.zoomControl.getContainer().classList.toggle('no-journey', !hasJourney);
      blueLayers.forEach(layer => map.removeLayer(layer));
      blueLayers = [];
      highlightChoice(data, null);
      data.total_path_coords.forEach(item => {
        if (item.coords?.length >= 2) {
          blueLayers.push(L.polyline(item.coords,
            {color: journeyColour(data.legs[item.leg], item.leg)}).addTo(map));
        }
      });
      // 候选完整绘制，仅默认缩放范围截取局部。
      data.choice_coords.forEach(item => {
        if (item.coords?.length >= 2) {
          blueLayers.push(L.polyline(item.coords,
            {color: '#64748b', weight: 4, opacity: 0.7, dashArray: '6 5'}).addTo(map));
        }
      });
      fitChoices(data);
    }

    function renderWays(data) {
      const list = document.getElementById('ways-list');
      list.hidden = !data.legs.length;
      let html = `<b>第 ${data.legs.length} 段 · 当前way:</b> ${data.current_way}
        <button type="button" class="track-locate" id="fit-choices"
          title="显示当前轨道与相连候选" aria-label="显示当前轨道与相连候选"><i class="bi bi-crosshair" aria-hidden="true"></i></button><br>`;
      if (data.choices.length === 0) {
        html += `<b>${data.stop_reason || '本段已停止推进，可搜索轨道开始下一段'}</b>`;
      } else {
        let sortedChoices = [...data.choice_coords];
        let idx = sortedChoices.findIndex(w => w.recommend);
        if (idx > 0) {
          let [rec] = sortedChoices.splice(idx, 1);
          sortedChoices.unshift(rec);
        }
        html += '<b>可选相连轨道:</b><ul class="list-group mt-2">' + sortedChoices.map(w => {
          let name = w.meta && w.meta.tags && w.meta.tags.name ? `（${w.meta.tags.name}）` : '（未命名）';
          let star = w.recommend ? '<span class="star" title="推荐接续轨道" aria-label="推荐接续轨道">⭐</span>' : '';
          let liClass = w.recommend ? 'list-group-item active-choice' : 'list-group-item';
          return `<li class='${liClass}' style='margin-bottom:2px;list-style-type:disc;'><button type="button" class="choice-way" data-wayid="${w.id}">${w.id}${name}${star}</button>
            <button type="button" class="track-locate locate-choice" data-wayid="${w.id}"
              title="查看这条候选轨道全貌" aria-label="查看候选轨道 ${w.id} 全貌"><i class="bi bi-crosshair" aria-hidden="true"></i></button></li>`;
        }).join('') + '</ul>';
      }
      list.innerHTML = html;
      renderExport(data);
      // 悬停高亮
      document.querySelectorAll('.choice-way').forEach(function(el){
        el.onmouseenter = function(){
          highlightChoice(data, el.getAttribute('data-wayid'));
        };
        el.onmouseleave = function(){
          highlightChoice(data, null);
        };
        el.onfocus = el.onmouseenter;
        el.onblur = el.onmouseleave;
        el.onclick = function(){
          runTrackAction(() => selectWay(el.getAttribute('data-wayid')));
        }
      });
      document.getElementById('fit-choices').onclick = () => fitChoices(data);
      document.querySelectorAll('.locate-choice').forEach(button => {
        button.onclick = () => {
          const choice = data.choice_coords.find(item => item.id == button.dataset.wayid);
          if (!choice?.coords.length) return;
          highlightChoice(data, choice.id);
          map.stop();
          map.fitBounds(choice.coords, {padding: [40, 40], maxZoom: 18, animate: false});
        };
      });
      renderMap(data);
    }

    function renderExport(data) {
      const list = document.getElementById('journey-legs');
      list.replaceChildren();
      const scope = document.getElementById('export-scope');
      const selected = scope.value;
      scope.replaceChildren(new Option('全部行程', 'all'));
      data.legs.forEach((leg, index) => {
        const row = document.createElement('div');
        row.className = 'border-start border-3 ps-2 mb-2 small';
        row.style.setProperty('border-left-color', journeyColour(leg, index), 'important');
        const title = document.createElement('div');
        title.className = 'fw-bold';
        title.textContent = `第 ${index + 1} 段 · ${leg.name}`;
        const info = document.createElement('div');
        info.className = 'text-muted';
        info.textContent = `${leg.path.length} 段轨道`;
        row.append(title, info);
        list.appendChild(row);
        scope.add(new Option(`第 ${index + 1} 段`, String(index)));
      });
      scope.value = [...scope.options].some(option => option.value === selected) ? selected : 'all';
      scope.onchange = () => updateExportQuery(data);
      updateExportQuery(data);
    }

    function updateExportQuery(data) {
      const scope = document.getElementById('export-scope').value;
      const path = scope === 'all' ? data.total_path : data.legs[Number(scope)].path;
      const ids = [...new Set(path.map(item => item.way_id))];
      document.getElementById('total-path').hidden = ids.length === 0;
      const manual = data.total_path.filter(item => item.type === 'manual').length;
      document.getElementById('path-summary').textContent = `全部行程 · ${data.total_path.length} 段轨道`;
      document.getElementById('path-counts').textContent = `手动选择 ${manual} 段 · 自动推进 ${data.total_path.length - manual} 段`;
      const query = ids.length ? `[out:json][timeout:25];\n(\n${ids.map(id => `  way(${id});`).join('\n')}\n);\n(._;>;);\nout body;` : '';
      document.getElementById('overpass-query').value = query;
      document.getElementById('copy-query').disabled = !query;
      document.getElementById('export-status').textContent = '';
    }

    document.getElementById('download-kml').onclick = () => {
      if (!lastData?.legs?.length) return;
      const scope = document.getElementById('export-scope').value;
      const kml = journeyKml(lastData, scope, lastData.legs.map(journeyColour));
      const url = URL.createObjectURL(new Blob([kml], {type:'application/vnd.google-earth.kml+xml'}));
      const link = document.createElement('a');
      link.href = url;
      link.download = journeyFilename(lastData, scope);
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    document.getElementById('copy-query').onclick = async () => {
      const query = document.getElementById('overpass-query');
      if (!query.value) return;
      const status = document.getElementById('export-status');
      try {
        await navigator.clipboard.writeText(query.value);
        status.textContent = '已复制 Overpass 查询。';
      } catch (_) {
        document.getElementById('query-preview').open = true;
        query.focus();
        query.select();
        status.textContent = '无法自动复制，已选中查询内容，请按 Ctrl+C / ⌘C 复制。';
      }
    };

    async function selectWay(way_id, reset=false, options={}) {
      let data = await fetchWays(way_id, reset, options);
      while (data.choices.length === 1) {
        data = await fetchWays(data.choices[0]);
      }
      renderWays(data);
      return data;
    }

    let trackActionPending = false;
    async function runTrackAction(action) {
      if (trackActionPending) return;
      trackActionPending = true;
      const status = document.getElementById('query-status');
      status.classList.remove('text-danger');
      status.textContent = '加载中…';
      document.querySelectorAll('#way-form input, #way-form button, #query-results button, #element-detail button, #element-detail select, #undo-way').forEach(el => el.disabled = true);
      try {
        await action();
        if (status.textContent === '加载中…') status.textContent = '';
      } catch (error) {
        status.classList.add('text-danger');
        status.textContent = error.message || '请求失败，请重试。';
      } finally {
        trackActionPending = false;
        document.querySelectorAll('#way-form input, #way-form button, #query-results button, #element-detail button, #element-detail select, #undo-way').forEach(el => el.disabled = false);
      }
    }

    const typeNames = {rail: '铁路', subway: '地铁', light_rail: '轻轨', monorail: '单轨铁路'};
    let queryMarker = null;
    let queryCircle = null;
    let previewLayer = null;

    function clearPreview() {
      if (previewLayer) map.removeLayer(previewLayer);
      previewLayer = null;
    }

    function elementTitle(item) {
      return `${item.type === 'relation' ? '关系' : '轨道'}：${item.display_name || item.name}（${item.id}）`;
    }

    function relationDirection(item) {
      if (item.relation_type !== 'route') return '';
      if (item.roundtrip) {
        return item.from && item.from === item.to ? `环线 · 起终点：${item.from}` : '环线';
      }
      return item.from || item.to
        ? `${item.from || '起点未标注'} → ${item.to || '终点未标注'}`
        : '未标注起终点';
    }

    function elementButton(item) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'list-group-item list-group-item-action';
      const title = document.createElement('div');
      title.textContent = elementTitle(item);
      const detail = document.createElement('small');
      detail.className = 'text-muted';
      const relationTypes = {route:'运行线路', route_master:'线路总关系', network:'交通网络'};
      detail.textContent = [typeNames[item.railway] || item.railway,
        relationTypes[item.relation_type] || item.relation_type, item.route, item.ref].filter(Boolean).join(' · ');
      button.append(title, detail);
      const directionText = relationDirection(item);
      if (directionText) {
        const direction = document.createElement('div');
        direction.className = 'small fw-bold';
        direction.textContent = directionText;
        button.appendChild(direction);
      }
      const roles = (item.roles || []).filter(Boolean);
      if (roles.length) {
        const role = document.createElement('div');
        role.className = 'small text-muted';
        role.textContent = `成员角色：${roles.join(' / ')}`;
        button.appendChild(role);
      }
      button.onclick = () => runTrackAction(() => showElement(item.type, item.id));
      return button;
    }

    async function showElement(kind, id) {
      const response = await fetch(`/elements/${kind}/${id}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '要素加载失败。');
      clearPreview();
      previewLayer = L.featureGroup(data.geometry.map(coords =>
        L.polyline(coords, {color:'#f08c00', weight:6, opacity:0.85}))).addTo(map);
      const panel = document.getElementById('element-detail');
      panel.replaceChildren();
      const heading = document.createElement('h6');
      heading.className = 'd-flex align-items-center gap-1';
      const headingText = document.createElement('span');
      headingText.style.minWidth = '0';
      headingText.textContent = elementTitle(data);
      heading.appendChild(headingText);
      panel.appendChild(heading);
      const zoom = document.createElement('button');
      zoom.type = 'button';
      zoom.className = 'track-locate flex-shrink-0';
      zoom.innerHTML = '<i class="bi bi-crosshair" aria-hidden="true"></i>';
      zoom.title = '缩放到此要素';
      zoom.setAttribute('aria-label', '缩放到此要素');
      zoom.disabled = !data.geometry.length;
      zoom.onclick = () => { if (previewLayer && previewLayer.getBounds().isValid()) map.fitBounds(previewLayer.getBounds(), {padding:[25,25], maxZoom:18}); };
      heading.appendChild(zoom);
      if (kind === 'way') {
        const beginLeg = async transfer => {
          await selectWay(id, !transfer, {transfer});
          clearPreview();
          document.querySelectorAll('#query-results details, #element-detail details')
            .forEach(section => section.open = false);
          document.getElementById('way_id').value = id;
          document.getElementById('query-status').textContent = `已开始第 ${lastData.legs.length} 段行程。`;
          panel.querySelectorAll('[data-next-leg], [data-start-leg]').forEach(button => button.remove());
        };
        if (!lastData?.legs?.length) {
          const start = document.createElement('button');
          start.dataset.startLeg = '';
          start.className = 'btn btn-sm btn-primary mb-2 me-2';
          start.textContent = '从此轨道开始探索';
          start.onclick = () => runTrackAction(() => beginLeg(false));
          panel.appendChild(start);
        }
        if (lastData?.legs?.length) {
          const next = document.createElement('button');
          next.dataset.nextLeg = '';
          next.className = 'btn btn-sm btn-outline-primary mb-2';
          next.textContent = '作为下一段继续';
          next.onclick = () => runTrackAction(() => beginLeg(true));
          panel.appendChild(next);
        }
      }
      const directionText = relationDirection(data);
      if (directionText) {
        const direction = document.createElement('p');
        direction.className = 'fw-bold my-2';
        direction.textContent = directionText;
        panel.appendChild(direction);
      }
      const membershipSection = document.createElement('details');
      membershipSection.open = true;
      const membershipTitle = document.createElement('summary');
      membershipTitle.className = 'fw-bold my-2';
      membershipTitle.textContent = '直接所属关系';
      const memberships = document.createElement('div');
      memberships.className = 'list-group mb-2';
      data.memberships.forEach(item => memberships.appendChild(elementButton(item)));
      if (!data.memberships.length) {
        memberships.textContent = '当前索引中没有直接所属关系。';
        memberships.className = 'small text-muted mb-2';
      }
      membershipSection.append(membershipTitle, memberships);
      panel.appendChild(membershipSection);
      const tags = document.createElement('details');
      const caption = document.createElement('summary');
      caption.textContent = '原始标签';
      const table = document.createElement('table');
      table.className = 'table table-sm small';
      Object.entries(data.tags).forEach(([key, value]) => {
        const row = table.insertRow();
        row.insertCell().textContent = key;
        row.insertCell().textContent = value;
      });
      tags.append(caption, table);
      panel.appendChild(tags);
      if (kind === 'relation') {
        const note = document.createElement('p');
        note.className = 'small text-muted';
        note.textContent = `共 ${data.members.length} 个直接成员，按 OSM 原始顺序列出；高亮本地收录的 ${data.ways.length} 段轨道（含子关系）。车站、站台等未收录成员只展示信息。`;
        const members = document.createElement('div');
        members.className = 'list-group';
        members.style.maxHeight = '260px';
        members.style.overflowY = 'auto';
        data.members.forEach((member, index) => {
          const item = document.createElement(member.available ? 'button' : 'div');
          item.className = 'list-group-item small';
          const memberType = {w:'轨道', r:'关系', n:'节点'}[member.type] || member.type;
          item.textContent = `${index + 1}. ${memberType} ${member.ref} · ${member.role || '无角色'}${member.available ? '' : '（未收录）'}`;
          if (member.available) item.onclick = () => runTrackAction(() => showElement(member.type === 'w' ? 'way' : 'relation', member.ref));
          members.appendChild(item);
        });
        panel.append(note, members);
      }
      document.getElementById('query-status').textContent = `已高亮${elementTitle(data)}。`;
    }

    async function queryNearby(latlng, radius) {
      clearPreview();
      document.getElementById('element-detail').replaceChildren();
      const container = document.getElementById('query-results');
      container.replaceChildren();
      if (queryMarker) map.removeLayer(queryMarker);
      if (queryCircle) map.removeLayer(queryCircle);
      queryMarker = L.circleMarker(latlng, {radius:5, color:'#333', fillOpacity:1}).addTo(map);
      queryCircle = L.circle(latlng, {radius, color:'#666', weight:1, fillOpacity:0.06}).addTo(map);
      const response = await fetch(`/nearby?lat=${latlng.lat}&lon=${latlng.lng}&radius=${radius}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '附近要素查询失败。');
      document.getElementById('query-status').textContent =
        `附近 ${radius} 米：${data.total} 段轨道、${data.relations.length} 个所属关系。` +
        (data.total > data.ways.length ? `仅显示最近 ${data.ways.length} 段，请减小查询半径或调整查询位置。` : '') +
        (!data.total ? '此处未找到已收录轨道，请靠近轨道右键查询。' : '') +
        (!data.relations_available ? '当前为旧索引，重新生成索引后可查看关系。' : '');
      [['附近轨道（按距离）', data.ways], ['所属关系', data.relations]].forEach(([title, items]) => {
        if (!items.length) return;
        const group = document.createElement('details');
        group.open = true;
        const heading = document.createElement('summary');
        heading.className = 'list-group-item bg-light fw-bold';
        heading.textContent = title;
        group.appendChild(heading);
        items.forEach(item => group.appendChild(elementButton(item)));
        container.appendChild(group);
      });
    }

    map.on('contextmenu', event => {
      L.DomEvent.preventDefault(event.originalEvent);
      if (trackActionPending) return;
      const point = event.latlng.wrap();
      const menu = document.createElement('div');
      menu.setAttribute('role', 'menu');
      menu.setAttribute('aria-label', '查找附近');
      menu.tabIndex = -1;
      const title = document.createElement('div');
      title.className = 'small text-muted mb-2';
      title.textContent = '查找附近';
      menu.appendChild(title);
      const buttons = [100, 250, 500].map(radius => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('role', 'menuitem');
        button.className = 'btn btn-sm btn-light d-block w-100 text-start mb-1';
        button.textContent = `${radius}米`;
        button.onclick = () => {
          map.closePopup();
          runTrackAction(() => queryNearby(point, radius));
        };
        menu.appendChild(button);
        return button;
      });
      // 支持键盘选择；点击地图其他位置或按 Escape 关闭菜单。
      menu.onkeydown = e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const index = buttons.indexOf(document.activeElement);
          const direction = e.key === 'ArrowDown' ? 1 : -1;
          const next = index < 0 ? (direction === 1 ? 0 : buttons.length - 1)
            : (index + direction + buttons.length) % buttons.length;
          buttons[next].focus();
        }
      };
      L.DomEvent.disableClickPropagation(menu);
      L.popup({className:'nearby-menu', minWidth:90, maxWidth:120, closeButton:false})
        .setLatLng(event.latlng).setContent(menu).openOn(map);
      menu.focus({preventScroll:true});
    });

    document.getElementById('undo-way').onclick = () => runTrackAction(async () => {
      const response = await fetch('/journey/undo-way', {method:'POST'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '退回失败，请重试。');
      document.getElementById('element-detail').replaceChildren();
      clearPreview();
      document.getElementById('way_id').value = data.current_way || '';
      // 直接显示退回后的状态，不调用会自动推进的 selectWay。
      renderWays(data);
    });

    document.getElementById('way-form').onsubmit = async function(e) {
      e.preventDefault();
      const id = document.getElementById('way_id').value.trim();
      await runTrackAction(async () => {
        if (!/^\d+$/.test(id)) throw new Error('请输入数字轨道 ID，或在地图上右键查询。');
        const hasJourney = Boolean(lastData?.legs?.length);
        await selectWay(id, !hasJourney, {transfer:hasJourney});
        clearPreview();
      });
    };


  </script>

</body>
